name: pi-agents-controller

services:
  controller:
    build:
      context: ../services/gateway-api
    image: pi-agents-controller:0.1.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - controller_data:/data

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  controller_data:
